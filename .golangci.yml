version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - unconvert
    - wsl_v5
  settings:
    errcheck:
      # Status and error printing use the process terminal.
      exclude-functions:
        - fmt.Fprintln
        - fmt.Fprintf
        - fmt.Print
        - fmt.Println

formatters:
  enable:
    - gofmt
    - goimports
    - gofumpt
