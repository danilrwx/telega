name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [linux, openbsd]
        arch: [amd64, arm64, armv7]
        include:
          - os: darwin
            arch: arm64
            runner: macos-15
          - os: darwin
            arch: amd64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27.3"
      - name: Package telega
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.os }}/${{ matrix.arch }}
        run: ./scripts/package.sh "$TARGET" "$VERSION" dist
      - name: Check packaged binary on macOS
        if: matrix.os == 'darwin'
        env:
          VERSION: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          tar -xzf "dist/telega_darwin_${ARCH}.tar.gz" -C dist telega
          test "$(dist/telega --version)" = "telega $VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: telega_${{ matrix.os }}_${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        working-directory: dist
        run: |
          test "$(find . -maxdepth 1 -name 'telega_*.tar.gz' | wc -l)" -eq 8
          sha256sum telega_*.tar.gz > SHA256SUMS
          gh release create "$VERSION" --verify-tag \
            --title "$VERSION" --notes-from-tag telega_*.tar.gz SHA256SUMS
